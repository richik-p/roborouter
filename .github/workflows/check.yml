name: check
on:
  pull_request:
  push:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: npm ci
      - run: uv sync --all-packages --dev
      - run: make check
      - run: npx playwright install --with-deps chromium
      - run: make e2e
