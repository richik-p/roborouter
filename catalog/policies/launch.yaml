policies:
  - id: pi05-libero
    revision: lerobot-pi05-libero-finetuned
    name: π₀.₅ LIBERO
    family: pi0.5
    description: LeRobot π₀.₅ checkpoint fine-tuned for the four LIBERO suites.
    robot_classes: [manipulator.single_arm]
    task_families: [pick_and_place, articulated_object_interaction]
    source:
      repository: https://huggingface.co/lerobot/pi05_libero_finetuned_v044
      checkpoint: lerobot/pi05_libero_finetuned_v044
      checkpoint_revision: 8e174154ef5f6c60a8da12ae99c303d8963138c1
    runtime:
      adapter: vla_eval_lerobot
      framework: lerobot
      framework_revision: 0.6.0
      engine_revision: vla-eval-0.4.0
      config: configs/model_servers/lerobot/pi05_libero.yaml
    observations:
      sensor_types: [vision.rgb, proprioception.ee_gripper]
      cameras: [scene, wrist]
      state_schema: libero.ee_gripper.v1
      language_prompt: true
    actions:
      schema: manipulation.ee_delta_pose.v1
      dimensions: 7
      horizon: 10
      expected_rate_hz: 20
      frame: robot_base
      normalization_id: lerobot/pi05_libero_finetuned:stats
    availability: {weights: open, code: open, license: gemma}
    evidence:
      - level: UPSTREAM_REPRODUCTION
        source: https://github.com/allenai/vla-evaluation-harness/blob/main/docs/reproductions/lerobot.md
        checked_at: 2026-08-20
        description: Upstream harness reports 100/100 on LIBERO Object.
        exact_robot_match: true
        exact_runtime_match: true
    tags: [language-conditioned, manipulation, libero, executable]

