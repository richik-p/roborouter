  - id: openvla
    revision: research-2026-09-09
    name: OpenVLA
    family: OpenVLA
    description: >-
      7B open VLA (Prismatic VLM on Llama-2 with DINOv2/SigLIP) trained on Open
      X-Embodiment; one third-person image, no proprioception, single-step 7-D
      end-effector actions. LIBERO needs a per-suite fine-tuned checkpoint.
    robot_classes: [manipulator.single_arm]
    task_families: [pick_and_place, articulated_object_interaction]
    source:
      repository: https://github.com/openvla/openvla
      checkpoint: openvla/openvla-7b-finetuned-libero-object
      checkpoint_revision: 287d6cfdf12d07b1449505f66d9bf3550257e9b3
    runtime: null
    observations: {sensor_types: [vision.rgb], cameras: [scene], state_schema: null, language_prompt: true}
    actions: null
    availability: {weights: open, code: open, license: mit}
    evidence:
      - level: UPSTREAM_REPRODUCTION
        source: https://github.com/allenai/vla-evaluation-harness/blob/v0.4.0/docs/reproductions/openvla.md
        checked_at: 2026-09-09
        description: >-
          vla-eval v0.4.0 reproduced 76.2% LIBERO four-suite average (reported
          76.5%) with per-suite LoRA checkpoints; Object 86.6%, Goal 79.0%.
          Matching required JPEG round-trip, Lanczos resize, and 0.9 center crop.
          Checkpoint card declares MIT; the upstream README notes Llama-2
          community-license terms for the base model. No RoboRouter runner yet.
        exact_robot_match: true
        exact_runtime_match: false
    tags: [language-conditioned, manipulation, libero, research]

