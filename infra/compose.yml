services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roborouter
      POSTGRES_USER: roborouter
      POSTGRES_PASSWORD: roborouter
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roborouter"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: roborouter
      MINIO_ROOT_PASSWORD: roborouter-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 roborouter roborouter-local-only;
      do sleep 1; done; mc mb --ignore-existing local/roborouter-artifacts"

volumes:
  postgres-data:
  minio-data:

