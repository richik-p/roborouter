services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: roborouter
      POSTGRES_USER: roborouter
      POSTGRES_PASSWORD: roborouter
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roborouter"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    # MinIO stopped publishing minio/minio and minio/mc to Docker Hub (and quay refuses
    # pulls), so the original digests no longer resolve on a fresh host. These Bitnami
    # legacy images were verified by digest pull on 2026-10-02; they are unmaintained,
    # so pick a maintained S3-compatible store before any public deployment.
    image: docker.io/bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    environment:
      MINIO_ROOT_USER: roborouter
      MINIO_ROOT_PASSWORD: roborouter-local-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data

  minio-init:
    image: docker.io/bitnamilegacy/minio-client@sha256:00dcc4e58ada0df45bb7d9ee435af98295f96c27c3c68292ce78ec700a87b511
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 roborouter roborouter-local-only;
      do sleep 1; done; mc mb --ignore-existing local/roborouter-artifacts"

volumes:
  postgres-data:
  minio-data:
