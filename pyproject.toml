[project]
name = "roborouter-workspace"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["packages/contracts", "services/api", "services/eval-worker"]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.25.3",
  "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["packages/contracts/tests", "services/api/tests", "services/eval-worker/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
