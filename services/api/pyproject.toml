[project]
name = "roborouter-api"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.15.0",
  "aiosqlite>=0.21.0",
  "asyncpg>=0.30.0",
  "boto3>=1.40.0",
  "fastapi>=0.115.0",
  "pydantic-settings>=2.8.0",
  "pyyaml>=6.0.2",
  "roborouter-contracts",
  "sqlalchemy[asyncio]>=2.0.38",
  "uvicorn[standard]>=0.34.0",
]

[project.scripts]
roborouter-seed = "roborouter_api.seed:run"
roborouter-worker-credentials = "roborouter_api.worker_credentials:run"
roborouter-launch-credentials = "roborouter_api.launch_credentials:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roborouter_api"]

[tool.uv.sources]
roborouter-contracts = { workspace = true }
