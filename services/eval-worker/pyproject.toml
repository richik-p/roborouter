[project]
name = "roborouter-eval-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "huggingface-hub>=0.34.0",
  "httpx>=0.28.1",
  "pydantic-settings>=2.8.0",
  "pyyaml>=6.0.2",
  "roborouter-contracts",
]

[project.scripts]
roborouter-worker = "roborouter_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roborouter_worker"]

[tool.uv.sources]
roborouter-contracts = { workspace = true }
